{{- if .Values.argoworkflows.enabled }}
---
kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ include "openeo-argo.prefix" . }}-argo-access-role
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["workflows"]
    verbs: [ "get","create", "list", "update", "patch" ]
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "openeo-argo.argoAccessSAName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openeo-argo.labels" . | nindent 4 }}
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "openeo-argo.prefix" . }}-argo-access-rb
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "openeo-argo.prefix" . }}-argo-access-role
subjects:
- kind: ServiceAccount
  name: {{ include "openeo-argo.argoAccessSAName" . }}
  namespace: {{ .Release.Namespace }}
---
# Long-lived API token for the Argo Workflows access ServiceAccount.
# Declared directly (no Helm hook / Job) so it is created the same way under
# `helm install`, `helm template | kubectl apply`, Kustomize and ArgoCD. The
# kube-controller-manager token controller populates .data.token automatically.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "openeo-argo.argoTokenSecretName" . }}
  namespace: {{ .Release.Namespace }}
  annotations:
    kubernetes.io/service-account.name: {{ include "openeo-argo.argoAccessSAName" . }}
  labels:
    {{- include "openeo-argo.labels" . | nindent 4 }}
type: kubernetes.io/service-account-token
{{- end }}
