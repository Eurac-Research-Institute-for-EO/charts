{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "openeo-argo.serviceAccountName" . }}
  labels:
    {{- include "openeo-argo.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
---
kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ include "openeo-argo.prefix" . }}-argo-pods-role
  namespace: {{ .Release.Namespace }}
rules:
  # create/delete/patch + pods/log: Calrissian (running inside the executor
  # pod) manages CWL tool pods and reads their logs
  # (openeo-argoworkflows#155).
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "delete", "patch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "openeo-argo.prefix" . }}-argo-pods-rb
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "openeo-argo.prefix" . }}-argo-pods-role
subjects:
- kind: ServiceAccount
  name: {{ include "openeo-argo.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
---
# Executor pods (Argo workflow pods) run under the namespace 'default'
# ServiceAccount, and Calrissian uses that token to create CWL tool pods.
# On RBAC-enforced clusters (k3s) this binding is required — the old microk8s
# deployment only worked because RBAC was permissive there
# (openeo-argoworkflows#155).
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "openeo-argo.prefix" . }}-executor-pods-rb
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "openeo-argo.prefix" . }}-argo-pods-role
subjects:
- kind: ServiceAccount
  name: default
  namespace: {{ .Release.Namespace }}
{{- end }}
